[package]
name = "cerebro-ciqa"
version = "1.0.0"
authors = ["meta-gp"]
description = "Cerebro: continuous integration of quality assurance"
documentation = "https://github.com/vidrl/cerebro"
homepage = "https://github.com/vidrl/cerebro"
repository = "https://github.com/vidrl/cerebro"
readme = "README.md"
keywords = ["meta-gp", "cerebro", "clinical", "pathogen", "metagenomics"]
categories = ["science"]
license = "GPL-3"
edition = "2021"
include = [
    "**/*.rs",
    "src/data/*",
    "Cargo.toml"
]

[[bin]]
name = "cerebro-ciqa"
path = "src/cli.rs"

[lib]
name = "cerebro_ciqa"


[dependencies]

cerebro-fs = { git = "https://github.com/vidrl/cerebro", package = "cerebro-fs", rev = "a74cd36913a1b6d620b7ddfc6613eee7e75d03e0" }
cerebro-client = { git = "https://github.com/vidrl/cerebro", package = "cerebro-client", rev = "a74cd36913a1b6d620b7ddfc6613eee7e75d03e0" }
cerebro-model = { git = "https://github.com/vidrl/cerebro", package = "cerebro-model", rev = "a74cd36913a1b6d620b7ddfc6613eee7e75d03e0" }
cerebro-pipeline = { git = "https://github.com/vidrl/cerebro", package = "cerebro-pipeline", rev = "a74cd36913a1b6d620b7ddfc6613eee7e75d03e0" }
meta-gpt = { git = "https://github.com/vidrl/meta-gpt", rev = "f97d55c19956c03f90a095fa8432ef4971aa9626", features = [], default-features = false }





anyhow = "1.0"
thiserror = "1.0"
serde_json = "1.0"
itertools = "0.10.3"
env_logger = "0.9.0"
log = "0.4"
csv = "1.2"
colored = "2.0"
ansi_term = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
tabled = { version = "0.9.0", features = ["color"] }
notify = { version = "6.1.1", features = ["serde"] }
clap = { version = "4.3.23", features = ["derive", "env", "unstable-styles", "wrap_help"] }
niffler = "2.5.0"
anstyle = "1.0.6"
uuid = { version = "1.2.1", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
actix-web-httpauth = "0.8.0"
reqwest = { version = "0.12.2", features = ["blocking", "json"] }
plotters = "0.3.7"
plotters-bitmap = "0.3.7"
taxonomy = "0.10.0"
rand = "0.9.0"
statrs = "0.18.0"
nvml-wrapper = "0.10.0"
rayon = "1.10.0"
ratatui = "0.29.0"
glob = "0.3.3"
regex = "1.12.2"

[features]
default = []
local = ["meta-gpt/local"]
